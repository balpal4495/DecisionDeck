name: Chronicle on Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  chronicle:
    name: Stage Chronicle proposal
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --omit=optional

      - name: Get changed files
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD)
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Chronicle proposal
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: npx tsx scripts/chronicle-pr.ts

      - name: Commit proposal to Chronicle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .chronicle/proposals/
          git diff --staged --quiet && echo "No new proposals to commit" && exit 0
          git commit -m "chore: chronicle proposal for PR #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.title }}"
          git push
